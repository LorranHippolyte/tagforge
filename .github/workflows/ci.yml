name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build -o bin/tagforge ./cmd/tagforge

      - name: Test npm wrapper
        env:
          TAGFORGE_BINARY_PATH: ${{ github.workspace }}/bin/tagforge
        run: node --test packaging/npm/test/wrapper.test.js

      - name: Validate GoReleaser config
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
