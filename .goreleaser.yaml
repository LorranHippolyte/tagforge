version: 2

project_name: tagforge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tagforge
    main: ./cmd/tagforge
    binary: tagforge
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/LorranHippolyte/tagforge/internal/version.Version={{.Version}}
      - -X github.com/LorranHippolyte/tagforge/internal/version.Commit={{.ShortCommit}}
      - -X github.com/LorranHippolyte/tagforge/internal/version.Date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
