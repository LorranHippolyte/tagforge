version: 2

project_name: tagforge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tagforge
    main: ./cmd/tagforge
    binary: tagforge
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/LorranHippolyte/tagforge/internal/version.Version={{.Version}}
      - -X github.com/LorranHippolyte/tagforge/internal/version.Commit={{.ShortCommit}}
      - -X github.com/LorranHippolyte/tagforge/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: LorranHippolyte
    name: tagforge
  prerelease: auto

homebrew_casks:
  - name: tagforge
    binaries:
      - tagforge
    homepage: "https://github.com/LorranHippolyte/tagforge"
    description: "Safe, standards-compliant Google Tag Manager CLI and local MCP server"
    skip_upload: auto
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tagforge"]
          end
    repository:
      owner: LorranHippolyte
      name: tagforge
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"

scoops:
  - name: tagforge
    directory: bucket
    homepage: "https://github.com/LorranHippolyte/tagforge"
    description: "Safe, standards-compliant Google Tag Manager CLI and local MCP server"
    license: MIT
    skip_upload: auto
    repository:
      owner: LorranHippolyte
      name: tagforge
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"

winget:
  - name: tagforge
    publisher: LorranHippolyte
    package_identifier: LorranHippolyte.tagforge
    short_description: "Safe, standards-compliant Google Tag Manager CLI and local MCP server"
    license: MIT
    homepage: "https://github.com/LorranHippolyte/tagforge"
    skip_upload: auto
    repository:
      owner: LorranHippolyte
      name: winget-pkgs
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
