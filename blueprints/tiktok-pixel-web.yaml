id: tiktok-pixel-web
name: TikTok Pixel Web (Sandboxed Stape Template + Event ID Deduplication)
version: "1.0.0"
context: web
category: tiktok
description: Installs the sandboxed Stape TikTok Pixel Web template (stape-io/tiktok-web-tag) and Unique Event ID variable (stape-io/unique-event-id-variable) with Google Consent Mode v2 support, automatic GA4 dataLayer mapping, and TikTok Events API event_id deduplication.
docs_urls:
  - https://business-api.tiktok.com/portal/docs?id=1799004006287425
  - https://business-api.tiktok.com/portal/docs?id=1799004110681154
  - https://github.com/stape-io/tiktok-web-tag
params:
  - name: pixel_id
    description: TikTok Pixel ID (alphanumeric code from TikTok Events Manager)
    required: true
    pattern: "^[A-Za-z0-9]+$"
  - name: enable_consent_mode
    description: Enable Google Consent Mode integration on TikTok Pixel tags
    required: false
    default: "true"
    pattern: "^(true|false)$"
built_in_variables:
  - event
  - pageUrl
gallery_templates:
  - alias: tiktok_pixel_tag
    owner: stape-io
    repository: tiktok-web-tag
    acknowledge_permissions: true
  - alias: unique_event_id_var
    owner: stape-io
    repository: unique-event-id-variable
    acknowledge_permissions: true
folders:
  - key: tiktok_web_folder
    name: TikTok - Pixel Web
    notes: Managed by tagforge tiktok-pixel-web blueprint
variables:
  - key: const_tiktok_pixel_id
    name: CONST - TikTok Pixel ID
    type: c
    parent_folder: ref:tiktok_web_folder
    parameters:
      - key: value
        type: TEMPLATE
        value: "${pixel_id}"
  - key: var_unique_event_id
    name: VAR - Unique Event ID
    type: template_ref:unique_event_id_var
    parent_folder: ref:tiktok_web_folder
triggers:
  - key: pv_all_pages
    name: PV - All Pages
    type: pageview
    parent_folder: ref:tiktok_web_folder
  - key: ce_tiktok_events
    name: CE - TikTok Standard Events
    type: customEvent
    parent_folder: ref:tiktok_web_folder
    custom_event_filters:
      - type: matchRegex
        parameters:
          - key: arg0
            type: TEMPLATE
            value: "{{_event}}"
          - key: arg1
            type: TEMPLATE
            value: "^(view_item|add_to_cart|begin_checkout|add_payment_info|purchase|generate_lead|sign_up|search)$"
tags:
  - key: tag_tiktok_pageview
    name: TikTok - Pixel - Pageview
    type: template_ref:tiktok_pixel_tag
    parent_folder: ref:tiktok_web_folder
    firing_triggers:
      - "ref:pv_all_pages"
    tag_firing_option: oncePerEvent
    consent:
      status: needed
      types:
        - ad_storage
        - ad_user_data
        - ad_personalization
    parameters:
      - key: pixelIds
        type: TEMPLATE
        value: "{{CONST - TikTok Pixel ID}}"
      - key: eventNameSetupMethod
        type: TEMPLATE
        value: override
      - key: eventName
        type: TEMPLATE
        value: standard
      - key: eventNameStandard
        type: TEMPLATE
        value: Pageview
      - key: enableGoogleConsentMode
        type: BOOLEAN
        value: "${enable_consent_mode}"
      - key: eventId
        type: TEMPLATE
        value: "{{VAR - Unique Event ID}}"
  - key: tag_tiktok_events
    name: TikTok - Pixel - Standard Events
    type: template_ref:tiktok_pixel_tag
    parent_folder: ref:tiktok_web_folder
    firing_triggers:
      - "ref:ce_tiktok_events"
    tag_firing_option: oncePerEvent
    consent:
      status: needed
      types:
        - ad_storage
        - ad_user_data
        - ad_personalization
    parameters:
      - key: pixelIds
        type: TEMPLATE
        value: "{{CONST - TikTok Pixel ID}}"
      - key: eventNameSetupMethod
        type: TEMPLATE
        value: inherit
      - key: enableDataLayerMapping
        type: BOOLEAN
        value: "true"
      - key: enableGoogleConsentMode
        type: BOOLEAN
        value: "${enable_consent_mode}"
      - key: eventId
        type: TEMPLATE
        value: "{{VAR - Unique Event ID}}"
data_layer_snippets:
  - title: TikTok Pixel + GA4 Unified Data Layer Contract
    language: javascript
    description: Standard GA4 ecommerce and lead events automatically map to TikTok events (view_item->ViewContent, add_to_cart->AddToCart, begin_checkout->InitiateCheckout, purchase->Purchase, generate_lead->SubmitForm/Lead). Forward {{VAR - Unique Event ID}} as event_id in your GA4 tag when pairing with tiktok-events-api-sgtm for browser/server deduplication.
    code: |
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ ecommerce: null });
      window.dataLayer.push({
        event: "purchase",
        ecommerce: {
          transaction_id: "T_12345",
          value: 299.90,
          currency: "BRL",
          items: [{ item_id: "SKU_123", item_name: "Product", price: 299.90, quantity: 1 }]
        }
      });
