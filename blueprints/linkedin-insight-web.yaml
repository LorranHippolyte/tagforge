id: linkedin-insight-web
name: LinkedIn Insight Tag 2.0 (Official Community Template + Event Conversions)
version: "1.0.0"
context: web
category: linkedin
description: Installs the official LinkedIn Insight Tag 2.0 template (linkedin/linkedin-gtm-community-template) for sitewide retargeting and optional event conversion tracking with CAPI eventId deduplication.
docs_urls:
  - https://www.linkedin.com/help/lms/answer/a427660
  - https://github.com/linkedin/linkedin-gtm-community-template
params:
  - name: partner_id
    description: LinkedIn Insight Tag Partner ID (numeric)
    required: true
    pattern: "^[0-9]+$"
  - name: conversion_id
    description: Optional LinkedIn Campaign Manager Conversion ID for event conversion tracking
    required: false
    pattern: "^[0-9]+$"
  - name: conversion_event
    description: Custom dataLayer event name firing the optional LinkedIn Conversion tag
    required: false
    default: "generate_lead"
built_in_variables:
  - event
  - pageUrl
gallery_templates:
  - alias: linkedin_insight_tag
    owner: linkedin
    repository: linkedin-gtm-community-template
    acknowledge_permissions: true
  - alias: unique_event_id_var
    owner: stape-io
    repository: unique-event-id-variable
    acknowledge_permissions: true
folders:
  - key: linkedin_web_folder
    name: LinkedIn - Insight Tag
    notes: Managed by tagforge linkedin-insight-web blueprint
variables:
  - key: const_linkedin_partner_id
    name: CONST - LinkedIn Partner ID
    type: c
    parent_folder: ref:linkedin_web_folder
    parameters:
      - key: value
        type: TEMPLATE
        value: "${partner_id}"
  - key: const_linkedin_conversion_id
    name: CONST - LinkedIn Conversion ID
    type: c
    parent_folder: ref:linkedin_web_folder
    when_param_non_empty: conversion_id
    parameters:
      - key: value
        type: TEMPLATE
        value: "${conversion_id}"
  - key: var_unique_event_id
    name: VAR - Unique Event ID
    type: template_ref:unique_event_id_var
    parent_folder: ref:linkedin_web_folder
    when_param_non_empty: conversion_id
triggers:
  - key: pv_all_pages
    name: PV - All Pages
    type: pageview
    parent_folder: ref:linkedin_web_folder
  - key: ce_linkedin_conv
    name: CE - LinkedIn Conversion Event
    type: customEvent
    parent_folder: ref:linkedin_web_folder
    when_param_non_empty: conversion_id
    custom_event_filters:
      - type: equals
        parameters:
          - key: arg0
            type: TEMPLATE
            value: "{{_event}}"
          - key: arg1
            type: TEMPLATE
            value: "${conversion_event}"
tags:
  - key: tag_linkedin_base
    name: LinkedIn - Insight Tag 2.0 - Base
    type: template_ref:linkedin_insight_tag
    parent_folder: ref:linkedin_web_folder
    firing_triggers:
      - "ref:pv_all_pages"
    tag_firing_option: oncePerEvent
    consent:
      status: needed
      types:
        - ad_storage
        - ad_user_data
        - ad_personalization
    parameters:
      - key: partnerId
        type: TEMPLATE
        value: "{{CONST - LinkedIn Partner ID}}"
  - key: tag_linkedin_conversion
    name: LinkedIn - Insight Tag 2.0 - Conversion
    type: template_ref:linkedin_insight_tag
    parent_folder: ref:linkedin_web_folder
    when_param_non_empty: conversion_id
    firing_triggers:
      - "ref:ce_linkedin_conv"
    tag_firing_option: oncePerEvent
    consent:
      status: needed
      types:
        - ad_storage
        - ad_user_data
        - ad_personalization
    parameters:
      - key: partnerId
        type: TEMPLATE
        value: "{{CONST - LinkedIn Partner ID}}"
      - key: conversionId
        type: TEMPLATE
        value: "{{CONST - LinkedIn Conversion ID}}"
      - key: eventId
        type: TEMPLATE
        value: "{{VAR - Unique Event ID}}"
data_layer_snippets:
  - title: LinkedIn B2B Conversion + sGTM Enrichment Contract
    language: javascript
    description: Push a conversion event with user_data so GA4 forwards lead attributes and event_id for LinkedIn CAPI matching.
    code: |
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: "generate_lead",
        lead_source: "b2b_demo_form",
        user_data: {
          email_address: "buyer@company.com",
          first_name: "Ana",
          last_name: "Silva"
        }
      });
