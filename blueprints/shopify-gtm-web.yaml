id: shopify-gtm-web
name: Shopify + GTM Web Pack (Custom Pixel Bridge + GA4 + Consent Mode v2)
version: "1.0.0"
context: web
category: shopify
description: Production Web GTM container pack designed specifically for Shopify Customer Events (Custom Web Pixel sandbox) with Consent Mode v2 baseline, sandbox page_location override via GTES, full GA4 Ecommerce, event_id deduplication, optional sGTM forwarding, and optional Google Ads Enhanced Conversions.
docs_urls:
  - https://shopify.dev/docs/api/web-pixels-api
  - https://shopify.dev/docs/api/web-pixels-api/standard-events
  - https://developers.google.com/analytics/devguides/collection/ga4/ecommerce?client_type=gtm
params:
  - name: measurement_id
    description: GA4 Measurement ID (e.g. G-XXXXXXXXXX)
    required: true
    pattern: "^G-[A-Z0-9]+$"
  - name: server_container_url
    description: Optional first-party Server-Side GTM domain (e.g. https://metrics.store.com)
    required: false
    pattern: "^https://.+"
  - name: google_ads_conversion_id
    description: Optional Google Ads Conversion ID (numeric without AW-)
    required: false
    pattern: "^[0-9]+$"
  - name: google_ads_purchase_label
    description: Optional Google Ads Purchase Conversion Label (requires google_ads_conversion_id)
    required: false
  - name: default_currency
    description: Default ISO 4217 currency code
    required: false
    default: "BRL"
  - name: default_consent_state
    description: Initial Consent Mode v2 default before Customer Privacy check updates (denied or granted)
    required: false
    default: "denied"
    pattern: "^(denied|granted)$"
built_in_variables:
  - event
  - pageUrl
  - pageHostname
  - pagePath
  - referrer
gallery_templates:
  - alias: unique_event_id_var
    owner: stape-io
    repository: unique-event-id-variable
    acknowledge_permissions: true
folders:
  - key: shopify_web_folder
    name: Shopify - GTM Web
    notes: Managed by tagforge shopify-gtm-web blueprint
variables:
  - key: const_ga4_id
    name: CONST - GA4 Measurement ID
    type: c
    parent_folder: ref:shopify_web_folder
    parameters:
      - key: value
        type: TEMPLATE
        value: "${measurement_id}"
  - key: const_consent_default
    name: CONST - Shopify Consent Default
    type: c
    parent_folder: ref:shopify_web_folder
    parameters:
      - key: value
        type: TEMPLATE
        value: "${default_consent_state}"
  - key: var_unique_event_id
    name: VAR - Unique Event ID
    type: template_ref:unique_event_id_var
    parent_folder: ref:shopify_web_folder
  - key: dlv_page_location
    name: DLV - shopify.page_location
    type: v
    parent_folder: ref:shopify_web_folder
    parameters:
      - key: dataLayerVersion
        type: INTEGER
        value: "2"
      - key: name
        type: TEMPLATE
        value: page_location
  - key: dlv_page_title
    name: DLV - shopify.page_title
    type: v
    parent_folder: ref:shopify_web_folder
    parameters:
      - key: dataLayerVersion
        type: INTEGER
        value: "2"
      - key: name
        type: TEMPLATE
        value: page_title
  - key: dlv_page_referrer
    name: DLV - shopify.page_referrer
    type: v
    parent_folder: ref:shopify_web_folder
    parameters:
      - key: dataLayerVersion
        type: INTEGER
        value: "2"
      - key: name
        type: TEMPLATE
        value: page_referrer
  - key: gtes_shopify
    name: GTES - Shopify GA4 Event Settings
    type: gtes
    parent_folder: ref:shopify_web_folder
    notes: Overrides sandbox iframe URLs with real storefront URLs and attaches event_id
    parameters:
      - key: eventSettingsTable
        type: LIST
        list:
          - type: MAP
            map:
              - key: parameter
                type: TEMPLATE
                value: page_location
              - key: parameterValue
                type: TEMPLATE
                value: "{{DLV - shopify.page_location}}"
          - type: MAP
            map:
              - key: parameter
                type: TEMPLATE
                value: page_title
              - key: parameterValue
                type: TEMPLATE
                value: "{{DLV - shopify.page_title}}"
          - type: MAP
            map:
              - key: parameter
                type: TEMPLATE
                value: page_referrer
              - key: parameterValue
                type: TEMPLATE
                value: "{{DLV - shopify.page_referrer}}"
          - type: MAP
            map:
              - key: parameter
                type: TEMPLATE
                value: event_id
              - key: parameterValue
                type: TEMPLATE
                value: "{{VAR - Unique Event ID}}"
          - type: MAP
            when_param_non_empty: server_container_url
            map:
              - key: parameter
                type: TEMPLATE
                value: server_container_url
              - key: parameterValue
                type: TEMPLATE
                value: "${server_container_url}"
  - key: const_gads_id
    name: CONST - Google Ads Conversion ID
    type: c
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_conversion_id
    parameters:
      - key: value
        type: TEMPLATE
        value: "${google_ads_conversion_id}"
  - key: const_gads_label
    name: CONST - Google Ads Conversion Label
    type: c
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_purchase_label
    parameters:
      - key: value
        type: TEMPLATE
        value: "${google_ads_purchase_label}"
  - key: dlv_ecom_value
    name: DLV - ecommerce.value
    type: v
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_purchase_label
    parameters:
      - key: dataLayerVersion
        type: INTEGER
        value: "2"
      - key: name
        type: TEMPLATE
        value: ecommerce.value
  - key: dlv_ecom_currency
    name: DLV - ecommerce.currency
    type: v
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_purchase_label
    parameters:
      - key: dataLayerVersion
        type: INTEGER
        value: "2"
      - key: setDefaultValue
        type: BOOLEAN
        value: "true"
      - key: defaultValue
        type: TEMPLATE
        value: "${default_currency}"
      - key: name
        type: TEMPLATE
        value: ecommerce.currency
  - key: dlv_ecom_tx_id
    name: DLV - ecommerce.transaction_id
    type: v
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_purchase_label
    parameters:
      - key: dataLayerVersion
        type: INTEGER
        value: "2"
      - key: name
        type: TEMPLATE
        value: ecommerce.transaction_id
  - key: dlv_user_email
    name: DLV - user_data.email
    type: v
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_purchase_label
    parameters:
      - key: dataLayerVersion
        type: INTEGER
        value: "2"
      - key: name
        type: TEMPLATE
        value: user_data.email
  - key: dlv_user_phone
    name: DLV - user_data.phone_number
    type: v
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_purchase_label
    parameters:
      - key: dataLayerVersion
        type: INTEGER
        value: "2"
      - key: name
        type: TEMPLATE
        value: user_data.phone_number
  - key: upd_shopify_enhanced
    name: UPD - Enhanced Conversions User Data
    type: awec
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_purchase_label
    parameters:
      - key: mode
        type: TEMPLATE
        value: MANUAL
      - key: email
        type: TEMPLATE
        value: "{{DLV - user_data.email}}"
      - key: phone_number
        type: TEMPLATE
        value: "{{DLV - user_data.phone_number}}"
triggers:
  - key: consent_init
    name: Consent Initialization - All Pages
    type: consentInit
    parent_folder: ref:shopify_web_folder
  - key: init_all
    name: Init - All Pages
    type: init
    parent_folder: ref:shopify_web_folder
  - key: ce_shopify_pageview
    name: CE - Shopify Page View
    type: customEvent
    parent_folder: ref:shopify_web_folder
    custom_event_filters:
      - type: equals
        parameters:
          - key: arg0
            type: TEMPLATE
            value: "{{_event}}"
          - key: arg1
            type: TEMPLATE
            value: shopify_page_view
  - key: ce_shopify_ecommerce
    name: CE - Shopify GA4 Ecommerce Events
    type: customEvent
    parent_folder: ref:shopify_web_folder
    custom_event_filters:
      - type: matchRegex
        parameters:
          - key: arg0
            type: TEMPLATE
            value: "{{_event}}"
          - key: arg1
            type: TEMPLATE
            value: "^(view_item_list|view_item|add_to_cart|remove_from_cart|view_cart|begin_checkout|add_shipping_info|add_payment_info|purchase)$"
  - key: ce_shopify_purchase
    name: CE - Shopify Purchase Conversion
    type: customEvent
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_purchase_label
    custom_event_filters:
      - type: equals
        parameters:
          - key: arg0
            type: TEMPLATE
            value: "{{_event}}"
          - key: arg1
            type: TEMPLATE
            value: purchase
tags:
  - key: tag_shopify_consent_default
    name: Consent Mode v2 - Shopify Default
    type: html
    parent_folder: ref:shopify_web_folder
    firing_triggers:
      - "ref:consent_init"
    tag_firing_option: oncePerLoad
    consent:
      status: notNeeded
    parameters:
      - key: html
        type: TEMPLATE
        value: |
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag("consent", "default", {
              ad_storage: "{{CONST - Shopify Consent Default}}",
              analytics_storage: "{{CONST - Shopify Consent Default}}",
              ad_user_data: "{{CONST - Shopify Consent Default}}",
              ad_personalization: "{{CONST - Shopify Consent Default}}",
              wait_for_update: 500
            });
          </script>
  - key: tag_shopify_googtag
    name: Google Tag - Shopify GA4
    type: googtag
    parent_folder: ref:shopify_web_folder
    firing_triggers:
      - "ref:init_all"
    tag_firing_option: oncePerEvent
    parameters:
      - key: tagId
        type: TEMPLATE
        value: "{{CONST - GA4 Measurement ID}}"
      - key: configSettingsTable
        type: LIST
        list:
          - type: MAP
            map:
              - key: parameter
                type: TEMPLATE
                value: send_page_view
              - key: parameterValue
                type: TEMPLATE
                value: "false"
          - type: MAP
            when_param_non_empty: server_container_url
            map:
              - key: parameter
                type: TEMPLATE
                value: server_container_url
              - key: parameterValue
                type: TEMPLATE
                value: "${server_container_url}"
      - key: eventSettingsVariable
        type: TEMPLATE
        value: "{{GTES - Shopify GA4 Event Settings}}"
  - key: tag_shopify_pageview
    name: GA4 - Event - Shopify Page View
    type: gaawe
    parent_folder: ref:shopify_web_folder
    firing_triggers:
      - "ref:ce_shopify_pageview"
    tag_firing_option: oncePerEvent
    parameters:
      - key: eventName
        type: TEMPLATE
        value: page_view
      - key: measurementIdOverride
        type: TEMPLATE
        value: "{{CONST - GA4 Measurement ID}}"
      - key: eventSettingsVariable
        type: TEMPLATE
        value: "{{GTES - Shopify GA4 Event Settings}}"
  - key: tag_shopify_ecommerce
    name: GA4 - Event - Shopify Ecommerce
    type: gaawe
    parent_folder: ref:shopify_web_folder
    firing_triggers:
      - "ref:ce_shopify_ecommerce"
    tag_firing_option: oncePerEvent
    parameters:
      - key: eventName
        type: TEMPLATE
        value: "{{Event}}"
      - key: measurementIdOverride
        type: TEMPLATE
        value: "{{CONST - GA4 Measurement ID}}"
      - key: sendEcommerceData
        type: BOOLEAN
        value: "true"
      - key: getEcommerceDataFrom
        type: TEMPLATE
        value: dataLayer
      - key: eventSettingsVariable
        type: TEMPLATE
        value: "{{GTES - Shopify GA4 Event Settings}}"
  - key: tag_shopify_gclidw
    name: Google Ads - Conversion Linker
    type: gclidw
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_conversion_id
    firing_triggers:
      - "ref:init_all"
    tag_firing_option: oncePerEvent
    parameters:
      - key: enableCrossDomain
        type: BOOLEAN
        value: "false"
  - key: tag_shopify_awct
    name: Google Ads - Conversion Tracking (Purchase)
    type: awct
    parent_folder: ref:shopify_web_folder
    when_param_non_empty: google_ads_purchase_label
    firing_triggers:
      - "ref:ce_shopify_purchase"
    tag_firing_option: oncePerEvent
    parameters:
      - key: conversionId
        type: TEMPLATE
        value: "{{CONST - Google Ads Conversion ID}}"
      - key: conversionLabel
        type: TEMPLATE
        value: "{{CONST - Google Ads Conversion Label}}"
      - key: conversionValue
        type: TEMPLATE
        value: "{{DLV - ecommerce.value}}"
      - key: currencyCode
        type: TEMPLATE
        value: "{{DLV - ecommerce.currency}}"
      - key: orderId
        type: TEMPLATE
        value: "{{DLV - ecommerce.transaction_id}}"
      - key: enableEnhancedConversion
        type: BOOLEAN
        value: "true"
      - key: cssProvidedEnhancedConversionValue
        type: TEMPLATE
        value: "{{UPD - Enhanced Conversions User Data}}"
data_layer_snippets:
  - title: Shopify Customer Events Custom Pixel (Web Pixels API -> GTM Bridge)
    language: javascript
    description: Paste in Shopify Admin -> Settings -> Customer events -> Add custom pixel (replace GTM-XXXXXXX with your container ID; configure Data Privacy permissions to align with your CMP).
    code: |
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }

      function applyCustomerPrivacyConsent(cp, command) {
        if (!cp) return;
        gtag("consent", command, {
          analytics_storage: cp.analyticsProcessingAllowed ? "granted" : "denied",
          ad_storage: cp.marketingAllowed ? "granted" : "denied",
          ad_user_data: cp.marketingAllowed ? "granted" : "denied",
          ad_personalization: cp.marketingAllowed ? "granted" : "denied"
        });
      }

      applyCustomerPrivacyConsent(init && init.customerPrivacy, "default");
      if (customerPrivacy && typeof customerPrivacy.subscribe === "function") {
        customerPrivacy.subscribe("visitorConsentCollected", (event) => {
          applyCustomerPrivacyConsent(event.customerPrivacy, "update");
        });
      }

      (function(w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l !== "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-XXXXXXX");

      function pageContext(event) {
        const doc = event?.context?.document || {};
        return {
          page_location: doc.location?.href,
          page_title: doc.title,
          page_referrer: doc.referrer
        };
      }

      function mapVariantItem(variant, quantity = 1) {
        return {
          item_id: variant?.sku || variant?.id,
          item_name: variant?.product?.title || variant?.title,
          item_brand: variant?.product?.vendor,
          item_variant: variant?.title,
          price: Number(variant?.price?.amount || 0),
          currency: variant?.price?.currencyCode,
          quantity
        };
      }

      function mapCheckoutItems(checkout) {
        return (checkout?.lineItems || []).map((li) => ({
          item_id: li.variant?.sku || li.variant?.id,
          item_name: li.variant?.product?.title || li.title,
          item_brand: li.variant?.product?.vendor,
          item_variant: li.variant?.title,
          price: Number(li.variant?.price?.amount || 0),
          currency: checkout?.totalPrice?.currencyCode,
          quantity: li.quantity
        }));
      }

      analytics.subscribe("page_viewed", (event) => {
        window.dataLayer.push({
          event: "shopify_page_view",
          ...pageContext(event)
        });
      });

      analytics.subscribe("collection_viewed", (event) => {
        const col = event.data?.collection;
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: "view_item_list",
          ...pageContext(event),
          ecommerce: {
            item_list_id: col?.id,
            item_list_name: col?.title,
            items: (col?.productVariants || []).map((pv, index) => ({ ...mapVariantItem(pv, 1), index }))
          }
        });
      });

      analytics.subscribe("product_viewed", (event) => {
        const pv = event.data?.productVariant;
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: "view_item",
          ...pageContext(event),
          ecommerce: {
            currency: pv?.price?.currencyCode,
            value: Number(pv?.price?.amount || 0),
            items: [mapVariantItem(pv, 1)]
          }
        });
      });

      analytics.subscribe("product_added_to_cart", (event) => {
        const line = event.data?.cartLine;
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: "add_to_cart",
          ...pageContext(event),
          ecommerce: {
            currency: line?.cost?.totalAmount?.currencyCode,
            value: Number(line?.cost?.totalAmount?.amount || 0),
            items: [mapVariantItem(line?.merchandise, line?.quantity || 1)]
          }
        });
      });

      analytics.subscribe("product_removed_from_cart", (event) => {
        const line = event.data?.cartLine;
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: "remove_from_cart",
          ...pageContext(event),
          ecommerce: {
            currency: line?.cost?.totalAmount?.currencyCode,
            value: Number(line?.cost?.totalAmount?.amount || 0),
            items: [mapVariantItem(line?.merchandise, line?.quantity || 1)]
          }
        });
      });

      analytics.subscribe("cart_viewed", (event) => {
        const cart = event.data?.cart;
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: "view_cart",
          ...pageContext(event),
          ecommerce: {
            currency: cart?.cost?.totalAmount?.currencyCode,
            value: Number(cart?.cost?.totalAmount?.amount || 0),
            items: (cart?.lines || []).map((line) => mapVariantItem(line.merchandise, line.quantity || 1))
          }
        });
      });

      analytics.subscribe("checkout_started", (event) => {
        const checkout = event.data?.checkout;
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: "begin_checkout",
          ...pageContext(event),
          ecommerce: {
            currency: checkout?.totalPrice?.currencyCode,
            value: Number(checkout?.totalPrice?.amount || 0),
            items: mapCheckoutItems(checkout)
          }
        });
      });

      analytics.subscribe("checkout_shipping_info_submitted", (event) => {
        const checkout = event.data?.checkout;
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: "add_shipping_info",
          ...pageContext(event),
          ecommerce: {
            currency: checkout?.totalPrice?.currencyCode,
            value: Number(checkout?.totalPrice?.amount || 0),
            shipping_tier: checkout?.shippingLine?.title,
            items: mapCheckoutItems(checkout)
          }
        });
      });

      analytics.subscribe("payment_info_submitted", (event) => {
        const checkout = event.data?.checkout;
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: "add_payment_info",
          ...pageContext(event),
          ecommerce: {
            currency: checkout?.totalPrice?.currencyCode,
            value: Number(checkout?.totalPrice?.amount || 0),
            items: mapCheckoutItems(checkout)
          }
        });
      });

      analytics.subscribe("checkout_completed", (event) => {
        const checkout = event.data?.checkout;
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: "purchase",
          ...pageContext(event),
          user_data: {
            email: checkout?.email,
            phone_number: checkout?.phone
          },
          ecommerce: {
            transaction_id: checkout?.order?.id || checkout?.token,
            value: Number(checkout?.totalPrice?.amount || 0),
            tax: Number(checkout?.totalTax?.amount || 0),
            shipping: Number(checkout?.shippingLine?.price?.amount || 0),
            currency: checkout?.totalPrice?.currencyCode,
            items: mapCheckoutItems(checkout)
          }
        });
      });
  - title: Shopify GTM Verification & Multi-Platform Composition
    language: markdown
    description: Notes on verifying sandboxed Custom Pixels and composing Meta, TikTok, or Pinterest tags on top of this pack.
    code: |
      1. Shopify Customer Events runs inside a sandboxed iframe: GTM Preview / Tag Assistant cannot attach reliably to the sandbox. Verify hits with GA4 DebugView and Chrome DevTools Network (`collect?v=2` or your custom sGTM domain).
      2. `send_page_view` is disabled on `Google Tag - Shopify GA4` because sandbox `document.location` is not the real storefront URL; `shopify_page_view` supplies real `page_location`, `page_title`, and `page_referrer` from `event.context.document`.
      3. Compose `meta-pixel-web`, `tiktok-pixel-web`, `pinterest-tag-web`, `microsoft-uet-web`, or `microsoft-clarity-web` into the same Web workspace — they reuse `VAR - Unique Event ID` and standard GA4 ecommerce events automatically.
